<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Project Hail Mary — A Tribute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a10"/>
      <stop offset="0.6" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#10060f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.4" stop-color="#f5c842"/>
      <stop offset="1" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c842"/>
      <stop offset="0.5" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#26c6da"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- star field -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="1.4" opacity="0.8"/>
    <circle cx="180" cy="120" r="1" opacity="0.5"/>
    <circle cx="260" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="340" cy="200" r="1" opacity="0.4"/>
    <circle cx="120" cy="240" r="1.6" opacity="0.9"/>
    <circle cx="420" cy="80" r="1" opacity="0.6"/>
    <circle cx="900" cy="60" r="1.3" opacity="0.7"/>
    <circle cx="1000" cy="140" r="1" opacity="0.5"/>
    <circle cx="1120" cy="70" r="1.5" opacity="0.85"/>
    <circle cx="1180" cy="220" r="1" opacity="0.5"/>
    <circle cx="1060" cy="260" r="1.2" opacity="0.6"/>
    <circle cx="820" cy="240" r="1" opacity="0.45"/>
    <circle cx="980" cy="30" r="1" opacity="0.5"/>
    <circle cx="700" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="600" cy="280" r="1" opacity="0.4"/>
  </g>

  <!-- distant star Tau Ceti -->
  <circle cx="1080" cy="160" r="120" fill="url(#sun)" opacity="0.35"/>
  <circle cx="1080" cy="160" r="26" fill="url(#sun)"/>

  <!-- the Hail Mary spacecraft heading out -->
  <g transform="translate(150 175)" stroke="#26c6da" stroke-width="2" fill="#0a1422">
    <ellipse cx="0" cy="0" rx="34" ry="34" fill="#10202e"/>
    <ellipse cx="0" cy="0" rx="20" ry="20" fill="#0a1422"/>
    <rect x="34" y="-7" width="40" height="14" rx="3" fill="#10202e"/>
    <line x1="-34" y1="0" x2="-78" y2="0" stroke="#f5c842" stroke-width="3"/>
    <circle cx="-86" cy="0" r="5" fill="#f5c842" stroke="none"/>
  </g>

  <text x="280" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="22" letter-spacing="6" fill="#26c6da" opacity="0.9">A&#160;&#160;T R I B U T E&#160;&#160;T O</text>
  <text x="278" y="222" font-family="Segoe UI, system-ui, sans-serif" font-weight="700" font-size="64" letter-spacing="1" fill="url(#title)">Project Hail Mary</text>
  <text x="282" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#b0bec5">One man. One ship. One last chance to save everything.</text>
</svg>
