name: 🐞 Bug report
description: Something on the site looks or behaves wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem with the tribute site!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I scroll to the characters section, Rocky's audio button does nothing...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the live site
        2. Click "..."
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile browser
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: macOS 14, iPhone 15, Windows 11...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag-and-drop any screenshots or screen recordings here.
